server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;

    # Same-origin API access: the app calls /api/*, nginx forwards to the FastAPI container.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Local LLM answers on CPU can take a while.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Flutter's main.dart.js / bootstrap files are not content-hashed: always revalidate them,
    # otherwise browsers keep running the previous build after a redeploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:png|svg|ico|ttf|otf|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
