# Full local stack: PostgreSQL+pgvector, Ollama, FastAPI backend, Flutter web UI.
#   docker compose up --build        -> UI on http://localhost:8080, API docs on http://localhost:8000/docs
# Already running Ollama on the host? See docker-compose.host-ollama.yml.
name: legal-rag

x-ollama-image: &ollama-image ollama/ollama:0.32.1

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: legalrag
      POSTGRES_PASSWORD: legalrag
      POSTGRES_DB: legalrag
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalrag -d legalrag"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: *ollama-image
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot job: pulls the generator (and judge) model into the ollama volume.
  ollama-pull:
    image: *ollama-image
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      JUDGE_MODEL: ${JUDGE_MODEL:-}
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$$OLLAMA_MODEL\" && if [ -n \"$$JUDGE_MODEL\" ]; then ollama pull \"$$JUDGE_MODEL\"; fi"]
    restart: "no"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://legalrag:legalrag@db:5432/legalrag
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      JUDGE_MODEL: ${JUDGE_MODEL:-}
      FTS_MAX_DF: ${FTS_MAX_DF:-0.2}
      AUTO_INGEST: "true"
    depends_on:
      db:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
        required: false
    volumes:
      # Evaluation runs (docker compose exec api python -m app.evaluation) land in the repo.
      - ./evaluation/results:/app/evaluation/results
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build: ./frontend/flutter_app
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  ollama:
