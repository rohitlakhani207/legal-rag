[project]
name = "legal-rag-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a PostgreSQL+pgvector database (TEST_DATABASE_URL)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501: the formatter wraps code; long strings are fine. B008: FastAPI's File()/Form() idiom.
ignore = ["E501", "B008"]
