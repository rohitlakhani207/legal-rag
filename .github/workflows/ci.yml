name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: legalrag
          POSTGRES_PASSWORD: legalrag
          POSTGRES_DB: legalrag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U legalrag"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://legalrag:legalrag@localhost:5432/legalrag_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (unit + integration against pgvector; no models downloaded)
        run: pytest -v
      - name: README benchmark table matches evaluation/results/latest.json
        run: python ../evaluation/generate_report.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=API_BASE_URL=/api

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.host-ollama.yml config --quiet
      - name: Build backend image
        run: docker build --build-arg PRELOAD_MODELS=false -t legal-rag-api .
